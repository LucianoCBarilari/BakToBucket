name: Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Test
      run: dotnet test -c Release --verbosity normal

    - name: Publish for Windows
      run: dotnet publish BakToBucket/BakToBucket.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true /p:Version=${{ steps.get_version.outputs.VERSION }} -o ./publish/windows

    - name: Publish for Linux
      run: dotnet publish BakToBucket/BakToBucket.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true /p:Version=${{ steps.get_version.outputs.VERSION }} -o ./publish/linux

    - name: Zip Windows Release
      run: |
        cd publish/windows
        zip -r ../../BakToBucket_v${{ steps.get_version.outputs.VERSION }}_win-x64.zip .
        cd ../..

    - name: Zip Linux Release
      run: |
        cd publish/linux
        chmod +x BakToBucket
        tar -czvf ../../BakToBucket_v${{ steps.get_version.outputs.VERSION }}_linux-x64.tar.gz .
        cd ../..

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        files: |
          BakToBucket_v${{ steps.get_version.outputs.VERSION }}_win-x64.zip
          BakToBucket_v${{ steps.get_version.outputs.VERSION }}_linux-x64.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set lowercase repository name for Docker
      id: repo_name
      run: |
        echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

    - name: Log in to the GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ steps.repo_name.outputs.REPO }}
        tags: |
          type=semver,pattern={{version}}
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./BakToBucket
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
