name: Release Binaries

on:
  push:
    branches: [ main ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish for Windows
      run: dotnet publish R2SentinelBak/R2SentinelBak.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true /p:Version=0.8.5 -o ./publish/windows

    - name: Publish for Linux
      run: dotnet publish R2SentinelBak/R2SentinelBak.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true /p:Version=0.8.5 -o ./publish/linux

    - name: Zip Windows Release
      run: |
        cd publish/windows
        zip -r ../../R2SentinelBak_v0.8.5_win-x64.zip .
        cd ../..

    - name: Zip Linux Release
      run: |
        cd publish/linux
        chmod +x R2SentinelBak
        tar -czvf ../../R2SentinelBak_v0.8.5_linux-x64.tar.gz .
        cd ../..

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v0.8.5
        name: Release v0.8.5
        files: |
          R2SentinelBak_v0.8.5_win-x64.zip
          R2SentinelBak_v0.8.5_linux-x64.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
